[project]
name = "finanz-o-mat"
version = "0.1.0"
description = "Umsatzsteuer-Voranmeldung aus Rechnungen berechnen, Abgabe selbst in Mein ELSTER"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "XlsxWriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
finanz-o-mat = "ustva.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ustva", "ustva.quellen"]

[tool.setuptools.package-data]
ustva = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Beispiel-CSV-Daten sind lange Zeilen
"tests/test_bank.py" = ["E501"]
